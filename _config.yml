permalink: /blog/:title

title : Vagner Ribas
description: Product Designer, Desenvolvedor Front End e Product Engineer especialista em IA em Porto Alegre, Brasil.
keywords: Vagner Ribas, Product Designer, UX Designer, UI Designer, Desenvolvedor Front End, Front End Developer, Product Engineer, Especialista em IA, AI Product Designer, Design Systems, Product Discovery, React, Figma, Porto Alegre, Remoto
author :
  name : Vagner Ribas
  email : vameri@gmail.com
  github : https://github.com/vameri
  linkdin: https://www.linkedin.com/in/vagneribas/
  instagram: https://www.instagram.com/vagneribas/

production_url : https://vameri.github.io/

languages: ["pt", "en", "es"]
default_lang: pt

collections:
  work:
    output: true
    permalink: /work/:name/

defaults:
  - scope:
      path: ""
    values:
      lang: pt
  - scope:
      path: "en"
    values:
      lang: en
  - scope:
      path: "es"
    values:
      lang: es
  - scope:
      path: ""
      type: work
    values:
      layout: project
      section: work
  - scope:
      path: "_work/pt"
      type: work
    values:
      lang: pt
      permalink: /work/:name/
  - scope:
      path: "_work/en"
      type: work
    values:
      lang: en
      permalink: /en/work/:name/
  - scope:
      path: "_work/es"
      type: work
    values:
      lang: es
      permalink: /es/work/:name/
  - scope:
      path: ""
      type: posts
    values:
      section: blog
      lang: pt

exclude:
  - Gemfile
  - Gemfile.lock
  - README.markdown
  - vendor
