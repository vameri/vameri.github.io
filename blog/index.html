---
layout: default
title: Blog
section: blog
description: Blog do vameri.
---
<div class="page">
  <h1>Blog</h1>
  {% for post in site.posts %}
  <article class="list">
    <small>{{ post.date | date: "%d/%m/%Y" }}</small>
    <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
    {% if post.description %}<p>{{ post.description }}</p>{% endif %}
  </article>
  {% endfor %}
</div>
