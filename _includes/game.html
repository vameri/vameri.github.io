{%- assign lang = page.lang | default: site.default_lang -%}
{%- assign g = site.data.game[lang] | default: site.data.game.pt -%}
{%- assign t = site.data.i18n[lang] -%}
{%- capture wa_url -%}https://wa.me/{{ site.data.seo.whatsapp }}?text={{ t.whatsapp_message | uri_escape }}{%- endcapture -%}
<button class="game-launcher" type="button" aria-label="{{ g.title }}: {{ g.launcher_label }}" aria-haspopup="dialog"
        data-game='{{ g | jsonify | replace: "'", "&#39;" }}' data-whatsapp="{{ wa_url }}" data-cv="/CV_Vagner_Ribas.pdf"
        data-src="/assets/js/bughunt.js?v={{ site.time | date: '%s' }}">
  <span class="game-launcher__btn" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7.5 7h9a5 5 0 0 1 4.9 6l-.8 3.9a2.5 2.5 0 0 1-4.3 1.2L14.4 16H9.6l-1.9 2.1a2.5 2.5 0 0 1-4.3-1.2L2.6 13A5 5 0 0 1 7.5 7z"/>
      <path d="M8 10.2v3.2M6.4 11.8h3.2"/>
      <circle cx="15.6" cy="10.8" r=".6" fill="currentColor"/><circle cx="17.4" cy="12.8" r=".6" fill="currentColor"/>
    </svg>
  </span>
  <span class="game-launcher__label" aria-hidden="true"><span>{{ g.launcher_label }}</span></span>
</button>
