---
layout: default
title: Work
section: work
description: UX Designer and Front End Developer
---
<div class="grid">
  {%- assign items = site.work | sort: "order" -%}
  {%- for item in items %}
  <div class="asset{% unless item.cover %} no-image{% endunless %}">
    <a href="{{ item.url }}" style="--tile: {{ item.color | default: '#e9e9e6' }};">
      {%- if item.cover %}
      <div class="asset-holder" style="background-image: url('{{ item.cover }}'); background-position: {{ item.cover_position | default: '50% 50%' }};" role="img" aria-label="{{ item.title }}"></div>
      {%- endif %}
      <div class="title">{{ item.title }}<small>{{ item.role }} &middot; {{ item.year }}</small></div>
    </a>
  </div>
  {%- endfor %}
</div>
